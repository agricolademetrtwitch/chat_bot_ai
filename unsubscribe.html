    <script>
      ;(function () {
        var storageKey = 'themePreference'

        function readPreference() {
          try {
            var rawPreference = window.localStorage.getItem(storageKey)
            if (!rawPreference) return null

            // Honor legacy raw-string values before JSON.parse, which would
            // throw on an unquoted 'light'/'dark' and skip this fallback.
            if (rawPreference === 'light' || rawPreference === 'dark') {
              return rawPreference
            }

            var parsedPreference = JSON.parse(rawPreference)
            if (parsedPreference === 'light' || parsedPreference === 'dark') {
              return parsedPreference
            }
          } catch (error) {
            return null
          }

          return null
        }

        var preference = readPreference()
        var systemTheme =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        var theme = preference || systemTheme
        var root = document.documentElement

        root.classList.toggle('dark', theme === 'dark')
        root.style.colorScheme = theme
        root.dataset.theme = theme
        root.dataset.themePreference = preference || 'system'
      })()
    </script>
